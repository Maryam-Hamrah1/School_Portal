<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>contact</title>
</head>
<body class="contact">
     <header>

        <nav>
            <h1>Hamrah High School</h1>
        
            <ul>
                <li ><a href="index.html">Home</a></li> 
                <li><a href="profile.html">Profile</a></li>
                <li><a href="course.html">Courses</a></li>
                <li><a href="contact.html">contact</a></li>
            </ul>

        </nav>

    </header>

     <!-- MAIN -->

  <main class="contact-main">

    <!-- TITLE -->

    <section class="contact-title">

      <h2>Contact Us</h2>

      <p>
        Send us a message if you have questions
        about enrollment or courses.
      </p>

    </section>

    <!-- CONTACT FORM -->

    <section class="contact-section">

      <form id="contactForm">

        <input
          type="text"
          id="contactName"
          placeholder="Your Name"
        >

        <input
          type="email"
          id="contactEmail"
          placeholder="Your Email"
        >

        <textarea
          id="contactMessage"
          placeholder="Your Message"
        ></textarea>

        <button type="submit">
          Send Message
        </button>

      </form>

      <!-- SUCCESS MESSAGE -->

      <div id="contactSuccess"></div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer>

    <p>Hamrah High School - 2026</p>

  </footer>

  <script src="script.js"></script>

</body>
</html>
